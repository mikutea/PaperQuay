name: Production packaging and recovery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-operations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    name: Container packaging and encrypted recovery
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check recovery input boundaries
        run: python3 -m unittest server/tests/operations_test.py -v
      - name: Install the distribution age utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
      - name: Build the three production images
        run: |
          docker pull postgres:18.6
          docker build --build-arg PAPERQUAY_REVISION="$GITHUB_SHA" -f server/deploy/Server.Dockerfile -t paperquay-ci-sync .
          docker build --build-arg PAPERQUAY_REVISION="$GITHUB_SHA" -f server/deploy/Web.Dockerfile -t paperquay-ci-web .
          docker build -f server/deploy/Identity.Dockerfile -t paperquay-ci-identity .
          echo "PAPERQUAY_TEST_DATABASE_IMAGE=$(docker image inspect postgres:18.6 --format '{{.Id}}')" >> "$GITHUB_ENV"
          echo "PAPERQUAY_TEST_SYNC_IMAGE=$(docker image inspect paperquay-ci-sync --format '{{.Id}}')" >> "$GITHUB_ENV"
          echo "PAPERQUAY_TEST_WEB_IMAGE=$(docker image inspect paperquay-ci-web --format '{{.Id}}')" >> "$GITHUB_ENV"
          echo "PAPERQUAY_TEST_IDENTITY_IMAGE=$(docker image inspect paperquay-ci-identity --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Rehearse full encrypted backup and isolated restore
        run: python3 server/tests/operations_docker.py --allow-disposable-docker-writes
