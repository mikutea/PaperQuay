name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron before parallel tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/cache-electron-runtime.cjs
          node node_modules/electron/install.js

      - name: Test pinned artifact cache helpers
        run: python -B -m unittest discover -s .github/scripts/tests -p 'test_*.py'

      - name: Typecheck and build frontend
        run: npm run build

      - name: Run tests
        run: node --test "tests/*.test.ts" "tests/*.test.mjs"

      - name: Verify native addon in Electron
        run: node electron/native/smoke.cjs

  native-platforms:
    name: Native filesystem (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - name: Install pinned Electron runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/cache-electron-runtime.cjs
          node node_modules/electron/install.js
      - run: npm run native:build
      - run: node --test tests/nativeFs.test.mjs tests/sourceAccess.test.mjs tests/databaseRestoreBoundary.test.mjs tests/migrationReadBoundary.test.mjs tests/directoryListingBoundary.test.mjs tests/sqliteOpenBoundary.test.mjs
      - run: node electron/native/smoke.cjs
