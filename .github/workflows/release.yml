name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or reuse one draft release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const tagName = context.ref.startsWith('refs/tags/')
              ? context.ref.replace('refs/tags/', '')
              : `app-v${packageJson.version}`;
            const version = tagName.replace(/^app-v/, '');
            if (version !== packageJson.version) {
              core.setFailed(`Release tag ${tagName} does not match package.json version ${packageJson.version}.`);
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseName = `PaperQuay v${version}`;
            const targetCommitish = context.sha;
            const releaseBodyTemplate = fs.existsSync('.github/release-notes.md')
              ? fs.readFileSync('.github/release-notes.md', 'utf8')
              : 'Download installers from Assets.';
            const releaseBody = releaseBodyTemplate.replaceAll('{{VERSION}}', version);

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const exactMatches = releases
              .filter((release) => release.tag_name === tagName)
              .sort((left, right) => new Date(left.created_at) - new Date(right.created_at));
            const untaggedVersionMatches = releases
              .filter((release) => release.name === releaseName && /^untagged-/.test(release.tag_name))
              .sort((left, right) => new Date(left.created_at) - new Date(right.created_at));
            const matches = [...exactMatches, ...untaggedVersionMatches]
              .filter((release, index, list) => list.findIndex((item) => item.id === release.id) === index);

            let release =
              exactMatches.find((item) => !item.draft) ??
              untaggedVersionMatches.find((item) => !item.draft) ??
              exactMatches[0] ??
              untaggedVersionMatches[0];

            if (release && !release.draft) {
              if (release.tag_name !== tagName || release.target_commitish !== targetCommitish) {
                throw new Error('Published release identity differs; create a new version.');
              }
              core.info('Existing published release is preserved.');
            } else if (release) {
              const { data } = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                tag_name: tagName,
                target_commitish: targetCommitish,
                name: releaseName,
                body: releaseBody,
                prerelease: true,
                ...(release.draft ? { draft: true } : {}),
              });
              release = data;
            } else {
              const { data } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tagName,
                target_commitish: targetCommitish,
                name: releaseName,
                body: releaseBody,
                draft: true,
                prerelease: true,
              });
              release = data;
            }

            for (const duplicate of matches) {
              if (duplicate.id !== release.id && duplicate.draft) {
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: duplicate.id,
                });
              }
            }

            core.setOutput('release_id', String(release.id));
            core.setOutput('tag_name', tagName);
            core.setOutput('version', version);

  build-electron:
    name: Build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            updateTarget: win-x64
            platform: windows-latest
            args: "--win --x64 --publish never"
          - name: Linux x64
            updateTarget: linux-x64
            platform: ubuntu-22.04
            args: "--linux --x64 --publish never"
          - name: macOS x64
            updateTarget: mac-x64
            platform: macos-15-intel
            args: "--mac --x64 --publish never"
          - name: macOS arm64
            updateTarget: mac-arm64
            platform: macos-15
            args: "--mac --arm64 --publish never"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/cache-electron-runtime.cjs
          node node_modules/electron/install.js

      - name: Build frontend
        run: npm run build

      - name: Package Electron app
        shell: bash
        run: |
          set -o pipefail
          node electron/build.cjs --config .github/electron-ci.cjs ${{ matrix.args }} 2>&1 | tee electron-build.log

      - name: Verify packaged runtime dependencies
        shell: bash
        run: |
          asar_path="$(find release -type f -name app.asar -print -quit)"
          test -n "$asar_path"
          npm run electron:verify-package -- "$asar_path"

      - name: Build Windows portable archive and checksums
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = '${{ needs.create-release.outputs.version }}'
          $portableName = "PaperQuay-$version-win-x64-portable.zip"
          $portableStage = 'release/portable-stage'
          $appPayload = Join-Path $portableStage 'PaperQuay-app'
          New-Item -ItemType Directory -Path $appPayload -Force | Out-Null
          Copy-Item -Path 'release/win-unpacked/*' -Destination $appPayload -Recurse
          Copy-Item -LiteralPath 'packaging/windows/portable/Start-PaperQuay.cmd' -Destination $portableStage
          Copy-Item -LiteralPath 'packaging/windows/portable/README.txt' -Destination (Join-Path $portableStage 'README-portable.txt')
          Compress-Archive -Path "$portableStage/*" -DestinationPath "release/$portableName" -CompressionLevel Optimal

          $assets = Get-ChildItem -LiteralPath release -File | Where-Object {
            $_.Extension -in @('.exe', '.msi', '.zip')
          } | Sort-Object Name
          if ($assets.Count -lt 3) {
            throw 'Windows release did not produce the installer, MSI, and portable ZIP assets.'
          }

          $checksumLines = foreach ($asset in $assets) {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash.ToLowerInvariant(), $asset.Name
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path $PWD 'release/SHA256SUMS.txt'),
            $checksumLines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Verify update metadata against built packages
        run: node packaging/mergeUpdateManifests.cjs verify release "${{ needs.create-release.outputs.version }}" "${{ matrix.updateTarget }}"

      - name: Bind update metadata to the final package bytes
        run: node packaging/releasePublication.cjs release "${{ needs.create-release.outputs.version }}" "${{ matrix.updateTarget }}" "${{ github.sha }}"

      - name: Report Electron build failure
        if: failure()
        shell: bash
        run: |
          if [ -f electron-build.log ]; then
            message="$(tail -n 120 electron-build.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Electron build failed::$message"
          fi

      - name: Upload Electron build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-build-log-${{ matrix.name }}
          path: electron-build.log
          if-no-files-found: ignore

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperquay-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.blockmap
            release/SHA256SUMS.txt
            release/stable*.yml
            release/publication-*.json
          if-no-files-found: error

      - name: Upload release assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { assertDraftIdentity, proofName } = require('./packaging/releasePublication.cjs');

            const releaseId = Number('${{ needs.create-release.outputs.release_id }}');
            const tagName = '${{ needs.create-release.outputs.tag_name }}';
            const { data: draft } = await github.rest.repos.getRelease({
              owner: context.repo.owner, repo: context.repo.repo, release_id: releaseId,
            });
            assertDraftIdentity(draft, releaseId, tagName, context.sha);
            const releaseDir = path.join(process.cwd(), 'release');
            const assetPatterns = [
              /\.exe$/i,
              /\.msi$/i,
              /\.dmg$/i,
              /\.zip$/i,
              /\.AppImage$/i,
              /\.deb$/i,
              /\.tar\.gz$/i,
              /\.blockmap$/i,
              /^SHA256SUMS\.txt$/i,
            ];

            const assets = fs.existsSync(releaseDir)
              ? fs.readdirSync(releaseDir)
                  .map((name) => path.join(releaseDir, name))
                  .filter((filePath) => fs.statSync(filePath).isFile())
                  .filter((filePath) => assetPatterns.some((pattern) => pattern.test(path.basename(filePath))))
              : [];

            if (assets.length === 0) {
              core.setFailed('No release assets were generated.');
              return;
            }

            // A retry replaces its proof only after all of that target's files
            // upload successfully. No same-name workflow artifacts are selected.
            const proofPath = path.join(releaseDir, proofName('${{ matrix.updateTarget }}'));
            if (!fs.existsSync(proofPath)) throw new Error('Publication proof missing.');
            assets.push(proofPath);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            async function deleteExistingAssetsByName(name) {
              const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner,
                repo,
                release_id: releaseId,
                per_page: 100,
              });

              for (const existing of existingAssets.filter((asset) => asset.name === name)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: existing.id,
                }).catch((error) => {
                  if (error.status !== 404) {
                    throw error;
                  }
                });
              }
            }

            async function deleteExistingAssetsByPattern(pattern) {
              const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner,
                repo,
                release_id: releaseId,
                per_page: 100,
              });

              for (const existing of existingAssets.filter((asset) => pattern.test(asset.name))) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: existing.id,
                }).catch((error) => {
                  if (error.status !== 404) {
                    throw error;
                  }
                });
              }
            }

            await deleteExistingAssetsByPattern(/^latest.*\.ya?ml$/i);

            for (const filePath of assets) {
              const name = path.basename(filePath);
              await deleteExistingAssetsByName(name);

              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  await github.rest.repos.uploadReleaseAsset({
                    owner,
                    repo,
                    release_id: releaseId,
                    name,
                    data: fs.readFileSync(filePath),
                    headers: {
                      'content-type': 'application/octet-stream',
                      'content-length': fs.statSync(filePath).size,
                    },
                  });
                  break;
                } catch (error) {
                  if (attempt === 3 || error.status !== 422) {
                    throw error;
                  }

                  await deleteExistingAssetsByName(name);
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
                }
              }

              core.info(`Uploaded ${name}`);
            }

  publish-release:
    name: Publish release
    needs:
      - create-release
      - build-electron
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install metadata tooling without runtime scripts
        run: npm ci --ignore-scripts
      - name: Verify uploaded packages, merge metadata and publish
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const assert = require('node:assert/strict');
            const crypto = require('node:crypto');
            const { SPECS, manifestNames, proofName, getPublicationAsset, MAX_PROOF_BYTES,
              decodePublicationProof, publicationFingerprint, prepareReleaseManifests,
              assertDraftIdentity } = require('./packaging/releasePublication.cjs');
            const releaseId = Number('${{ needs.create-release.outputs.release_id }}');
            const tagName = '${{ needs.create-release.outputs.tag_name }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = '${{ needs.create-release.outputs.version }}';

            const { data: release } = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: releaseId,
            });

            if (release.id !== releaseId || release.tag_name !== tagName || release.target_commitish !== context.sha) {
              throw new Error('Release identity changed before metadata publication.');
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: releaseId, per_page: 100,
            });
            const proofs = [];
            for (const target of Object.keys(SPECS)) {
              const asset = getPublicationAsset(assets, proofName(target));
              assert.ok(asset.size <= MAX_PROOF_BYTES, 'Oversized publication proof.');
              const response = await github.rest.repos.getReleaseAsset({
                owner, repo, asset_id: asset.id, headers: { accept: 'application/octet-stream' },
                request: { timeout: 30000 },
              });
              proofs.push(decodePublicationProof(asset, response.data));
            }
            const fingerprint = publicationFingerprint(proofs, assets, version, context.sha);
            prepareReleaseManifests(proofs, assets, version, context.sha, 'publication-input', 'release-metadata');
            function verifyMetadata(currentAssets) {
              for (const name of manifestNames) {
                const data = fs.readFileSync(path.join('release-metadata', name));
                const actual = getPublicationAsset(currentAssets, name);
                assert.equal(actual.size, data.length, 'Uploaded update metadata size differs.');
                assert.equal(actual.digest, 'sha256:' + crypto.createHash('sha256').update(data).digest('hex'),
                  'Uploaded update metadata checksum differs.');
              }
            }
            if (!release.draft) {
              verifyMetadata(assets);
              core.info('Already published release verified and preserved.');
              return;
            }
            assertDraftIdentity(release, releaseId, tagName, context.sha);
            for (const name of manifestNames) {
              const data = fs.readFileSync(path.join('release-metadata', name));
              for (const existing of assets.filter(asset => asset.name === name)) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: releaseId, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length },
              });
            }

            const finalAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: releaseId, per_page: 100,
            });
            assert.equal(publicationFingerprint(proofs, finalAssets, version, context.sha), fingerprint,
              'Publication assets changed while metadata was prepared.');
            verifyMetadata(finalAssets);
            const { data: finalDraft } = await github.rest.repos.getRelease({ owner, repo, release_id: releaseId });
            assertDraftIdentity(finalDraft, releaseId, tagName, context.sha);

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              tag_name: tagName,
              target_commitish: context.sha,
              draft: false,
              prerelease: true,
            });

            core.info(`Published release ${tagName}.`);
