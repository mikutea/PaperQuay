apply plugin: 'com.android.application'

// Derive the OS binding from the copied bundle, then verify its bytes before
// building. Operator settings and association documents remain outside Git.
def nativeWebRoot = file('src/main/assets/public')
def nativeLinkDocument = new File(nativeWebRoot, 'native-link-binding.json')
def nativeLinkHost = 'unconfigured.invalid'
if (nativeLinkDocument.exists()) {
    if (nativeLinkDocument.length() > 1024 * 1024) {
        throw new GradleException('PAPERQUAY_NATIVE_LINK_BINDING_INVALID')
    }
    def binding = new groovy.json.JsonSlurper().parse(nativeLinkDocument)
    if (binding.formatVersion != 1 || binding.platform != 'android' || !(binding.origin instanceof String)) {
        throw new GradleException('PAPERQUAY_NATIVE_LINK_BINDING_INVALID')
    }
    try {
        nativeLinkHost = new URI(binding.origin).host
    } catch (Exception ignored) {
        throw new GradleException('PAPERQUAY_NATIVE_LINK_BINDING_INVALID')
    }
}
def requestedNativeLinkHost = System.getenv('PAPERQUAY_NATIVE_LINK_HOST')
if (requestedNativeLinkHost != null && requestedNativeLinkHost != nativeLinkHost) {
    throw new GradleException('PAPERQUAY_NATIVE_LINK_HOST_MISMATCH')
}
if (!(nativeLinkHost instanceof String) || nativeLinkHost.length() > 253 || !(nativeLinkHost ==~ /(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z][a-z0-9-]{1,62}/)) {
    throw new GradleException('PAPERQUAY_NATIVE_LINK_HOST_INVALID')
}

android {
    namespace = "dev.paperquay.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.paperquay.mobile"
        manifestPlaceholders = [paperquayCallbackHost: nativeLinkHost]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register('validateNativeLinkBinding', Exec) {
    workingDir rootProject.projectDir.parentFile
    environment 'TSX_DISABLE_CACHE', '1'
    commandLine 'node', '--import', 'tsx', 'scripts/validate-native-links.ts',
        '--platform', 'android', '--host', nativeLinkHost, '--bundle', nativeWebRoot.absolutePath
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('validateNativeLinkBinding')
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
